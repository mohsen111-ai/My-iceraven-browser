name: Browsing regression checks

on:
  pull_request:
    branches: [iceraven]
    paths:
      - 'app/src/main/java/org/mozilla/fenix/components/ProfileMarkerMiddleware.kt'
      - 'app/src/main/java/org/mozilla/fenix/perf/ProfilerMarkerFactProcessor.kt'
      - 'app/src/test/java/org/mozilla/fenix/components/ProfileMarkerMiddlewareTest.kt'
      - 'app/src/test/java/org/mozilla/fenix/perf/ProfilerMarkerFactProcessorTest.kt'
      - 'automation/iceraven/browsing-tests/**'
      - '.github/workflows/browsing-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test real store and profiler dispatch paths
        run: |
          ./gradlew -p automation/iceraven/browsing-tests clean test \
            --no-daemon --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xms128m -Xmx1g -XX:MaxMetaspaceSize=512m' \
            -Pkotlin.compiler.execution.strategy=in-process
